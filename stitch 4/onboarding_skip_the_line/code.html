<html class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-3xl" data-icon="arrow_back">arrow_back</span>
</div>
<div class="text-primary flex size-12 shrink-0 items-center justify-end">
<span class="text-sm font-semibold uppercase tracking-widest">Skip</span>
</div>
</div>
<div class="flex-1 flex flex-col items-center justify-center px-6">
<!-- Hero Image / Illustration Area -->
<div class="@container w-full max-w-md mx-auto">
<div class="@[480px]:px-4 @[480px]:py-3">
<div class="w-full aspect-square bg-center bg-no-repeat bg-cover flex flex-col items-center justify-center overflow-hidden bg-primary/10 dark:bg-primary/5 border border-primary/20 rounded-xl relative group" data-alt="Interior of a luxury modern barber shop with gold accents" style='background-image: linear-gradient(to bottom, rgba(26,26,26,0.2), rgba(26,26,26,0.8)), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCmvE_dHCAYKaq-wlTAIEiMkO5JTQ4QzvvGgdQngw5aAf_DfmbceG8NNMLse8hNk4leL9A28eW9aKEEiwqsOASCfykq7UVi_3e_mmrVJKD-PMpKF1lAa1ZHUbc6IUBtpCk9R7GYJs8zd0r7W0_uCJyp6ONs1eC6SeE1msZwUo8M-qOHZSvRVs48k-uoFl5G2WlKidGzy4OEQA7SUSlxyVWtf1Ietbw0v8ANrTaYiz42ZH-NX94eaQQYUhh1LETHd3LY397XXzBPOlA");'>
<!-- Premium Icon Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-background-dark/60 backdrop-blur-sm p-8 rounded-full border border-primary/30 shadow-2xl shadow-primary/20">
<span class="material-symbols-outlined text-7xl text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 300;">
                                    person_check
                                </span>
</div>
</div>
</div>
</div>
</div>
<!-- Content Area -->
<div class="max-w-md w-full text-center mt-12">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[36px] font-extrabold leading-tight px-4 pb-3">
                    Skip the Line
                </h1>
<p class="text-slate-600 dark:text-slate-400 text-lg font-medium leading-relaxed pb-8 pt-1 px-8">
                    Arrive and get straight to your chair. No more waiting. Experience luxury on your schedule.
                </p>
<!-- Stepper/Pagination -->
<div class="flex w-full flex-row items-center justify-center gap-4 py-4">
<div class="h-1.5 w-6 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-6 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-12 rounded-full bg-primary shadow-lg shadow-primary/40"></div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="p-6 pb-12 w-full max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 px-6 rounded-xl transition-all duration-300 shadow-xl shadow-primary/20 flex items-center justify-center gap-2 group">
<span>Get Started</span>
<span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center text-slate-500 dark:text-slate-500 text-xs mt-6 uppercase tracking-[0.2em]">
                Elite Barbering Collective
            </p>
</div>
</div>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1A1A1A",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Top App Bar / Header -->
<div class="flex items-center p-6 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-12 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-widest flex-1 text-center">Elite Grooming</h2>
<div class="size-12"></div> <!-- Spacer for centering -->
</div>
<!-- Main Hero / Visual Area -->
<div class="flex w-full grow items-center justify-center px-8">
<div class="relative w-full max-w-sm aspect-[4/5] rounded-xl overflow-hidden shadow-2xl ring-1 ring-primary/20">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Interior of a luxury modern barbershop with gold accents" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASmt_EE3qv87Ql84l0wDxg0poXAXkT1TK7XXuByfZTBh_2V_TDHnjWRhqpDmSBZy5IvCd3ETgzBzwmkcyAY82tNw63WaAxp5MOTbxJAykMGdi_wCNPG4bRPi6d2WHYYByadUs-wrTy0GcU71J4DxjD5Lc7A99HfbIw3WokUCD70HMPh-7rRODQF094L40pphaqiJhksNgmVUwFUAfKsEqjMt5SlhNpoDVcoUPIxRkSSHfwwZHORkzmLqLSYQcQ6M7cLEqADfhAMM4')">
</div>
<!-- Gradient Overlay for Contrast -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-transparent opacity-80"></div>
<!-- Floating Icon Card -->
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-background-dark/80 backdrop-blur-md p-6 rounded-xl border border-primary/30 flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-5xl mb-2">map_pin_heart</span>
<div class="h-1 w-8 bg-primary rounded-full"></div>
</div>
</div>
</div>
<!-- Content Section -->
<div class="px-8 pt-8 pb-4 text-center">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-extrabold leading-tight mb-4">Discover Shops</h1>
<p class="text-slate-600 dark:text-slate-400 text-lg font-medium leading-relaxed max-w-xs mx-auto">
                Find the best barbers in your city with ease and book your premium experience.
            </p>
</div>
<!-- Stepper Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-4">
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
</div>
<!-- Action Button -->
<div class="p-8 pb-12">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-5 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Next</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>

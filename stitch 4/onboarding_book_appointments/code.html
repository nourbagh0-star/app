<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d4af35",
            "background-light": "#f8f7f6",
            "background-dark": "#1A1A1A",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Manrope', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center">
<div class="relative flex h-screen w-full max-w-[430px] flex-col bg-background-light dark:bg-background-dark overflow-hidden border-x border-slate-200 dark:border-slate-800">
<!-- Top Bar Navigation -->
<div class="flex items-center p-6 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-3xl">calendar_month</span>
</div>
<button class="text-slate-500 dark:text-slate-400 text-sm font-semibold uppercase tracking-widest">Skip</button>
</div>
<!-- Content Section -->
<div class="flex flex-col flex-1 px-8 pt-4">
<h2 class="text-primary text-sm font-bold uppercase tracking-[0.2em] mb-2">Experience Ease</h2>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-4xl font-extrabold leading-tight mb-4">
        Book Your <span class="text-primary">Cut</span> in Seconds
      </h1>
<p class="text-slate-600 dark:text-slate-400 text-lg font-medium leading-relaxed mb-10">
        Schedule your next visit anytime, anywhere with our premium booking system. Luxury at your fingertips.
      </p>
<!-- Calendar UI Component -->
<div class="bg-slate-100 dark:bg-slate-800/50 rounded-xl p-6 border border-slate-200 dark:border-slate-700 shadow-xl">
<div class="flex items-center justify-between mb-6">
<button class="text-slate-900 dark:text-slate-100 p-2 hover:bg-primary/20 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<p class="text-slate-900 dark:text-slate-100 text-lg font-bold">October 2023</p>
<button class="text-slate-900 dark:text-slate-100 p-2 hover:bg-primary/20 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 gap-1 text-center mb-2">
<p class="text-slate-400 text-xs font-bold uppercase">S</p>
<p class="text-slate-400 text-xs font-bold uppercase">M</p>
<p class="text-slate-400 text-xs font-bold uppercase">T</p>
<p class="text-slate-400 text-xs font-bold uppercase">W</p>
<p class="text-slate-400 text-xs font-bold uppercase">T</p>
<p class="text-slate-400 text-xs font-bold uppercase">F</p>
<p class="text-slate-400 text-xs font-bold uppercase">S</p>
</div>
<div class="grid grid-cols-7 gap-y-2">
<!-- Dummy dates to fill space -->
<div class="h-10 flex items-center justify-center text-slate-300 dark:text-slate-600 text-sm">28</div>
<div class="h-10 flex items-center justify-center text-slate-300 dark:text-slate-600 text-sm">29</div>
<div class="h-10 flex items-center justify-center text-slate-300 dark:text-slate-600 text-sm">30</div>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">1</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">2</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">3</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">4</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-bold rounded-full bg-primary text-background-dark shadow-lg shadow-primary/20">5</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">6</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">7</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">8</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">9</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">10</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">11</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-semibold rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">12</button>
</div>
</div>
<!-- Time Slots Teaser -->
<div class="mt-6 flex gap-3 overflow-x-auto pb-4 no-scrollbar">
<div class="px-4 py-2 rounded-lg bg-primary/10 border border-primary/30 text-primary text-sm font-bold whitespace-nowrap">09:00 AM</div>
<div class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 text-sm font-medium whitespace-nowrap">10:30 AM</div>
<div class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 text-sm font-medium whitespace-nowrap">01:00 PM</div>
<div class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 text-sm font-medium whitespace-nowrap">03:30 PM</div>
</div>
</div>
<!-- Bottom Navigation -->
<div class="p-8 space-y-6">
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3">
<div class="h-1.5 w-6 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-6 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-5 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
        Next
        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
